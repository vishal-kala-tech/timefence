[project]
name = "timefence"
version = "0.1.0"
requires-python = ">=3.10"
[project.scripts]
timefenced = "timefence.main:main"
[project.optional-dependencies]
dev = ["pytest>=7.4"]
[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[tool.setuptools]
package-dir={""="src"}
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
